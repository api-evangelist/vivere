aid: vivere
name: Vivere
description: >-
  Vivere Partners is a technology-enabled Managing General Agent (MGA) that
  provides specialty property and management liability insurance solutions for
  complex risks. Founded and led by CEO Christopher McKechnie, who brings more
  than 25 years of insurance industry experience, Vivere combines deep
  underwriting expertise with advanced analytics and alternative data to deliver
  faster quotes, tailored coverage, and competitive terms for niche insurance
  lines, while giving carriers and capacity providers greater portfolio
  performance visibility. The company raised $7.5 million in seed funding led by
  General Catalyst, with participation from Pathlight Ventures and Greenlight Re.
